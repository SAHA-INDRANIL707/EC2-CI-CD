services:
  # ==========================================
  # Python Backend Service (Pulled from Docker Hub)
  # ==========================================
  backend:
    image: ${DOCKERHUB_USERNAME:-indranilsaha}/calculator-backend:latest
    container_name: calculator-backend
    restart: always
    ports:
      - "3001:8000"
    environment:
      - PORT=8000
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - calculator-net

  # ==========================================
  # Next.js Frontend Service (Pulled from Docker Hub)
  # ==========================================
  frontend:
    image: ${DOCKERHUB_USERNAME:-indranilsaha}/calculator-frontend:latest
    container_name: calculator-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/app1
      - NEXT_PUBLIC_API_URL=/app2
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - calculator-net

# ==========================================
# Shared Network Configuration
# ==========================================
networks:
  calculator-net:
    driver: bridge
